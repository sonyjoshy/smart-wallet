<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wallet - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="index.html">Smart Wallet</a>
        <span class="text-white d-none d-md-inline">Your journey to smarter finances</span>
    </div>
</nav>

<main class="container min-vh-100 d-flex align-items-center py-5">
    <div class="row align-items-center justify-content-center g-5 w-100">

        <div class="col-lg-6 text-center">
            <img
                src="https://static.vecteezy.com/system/resources/previews/066/863/516/non_2x/money-management-concept-wallet-with-money-accounting-and-saving-money-money-management-business-personal-finance-management-and-savings-flat-style-illustration-vector.jpg"
                alt="Financial planning illustration"
                class="img-fluid rounded-4 mb-4"
            >

            <h2 class="fw-bold text-primary">Start Managing Your Money</h2>
            <p class="text-secondary fs-5">
                Create your account to organize your income and expenses in one place.
            </p>
        </div>

        <div class="col-lg-5 col-md-8">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5">

                    <h2 class="fw-bold text-primary mb-2">Create Account</h2>
                    <p class="text-secondary mb-4">Register for Smart Wallet.</p>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regUsername" class="form-label fw-semibold">Username</label>
                            <input
                                type="text"
                                id="regUsername"
                                class="form-control form-control-lg"
                                placeholder="Choose a username"
                                autocomplete="username"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input
                                type="email"
                                id="email"
                                class="form-control form-control-lg"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label for="regPassword" class="form-label fw-semibold">Password</label>
                            <input
                                type="password"
                                id="regPassword"
                                class="form-control form-control-lg"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100">
                            Register
                        </button>
                    </form>

                    <hr class="my-4">

                    <p class="text-center text-secondary mb-0">
                        Already have an account?
                        <a href="index.html" class="fw-bold text-decoration-none">Login</a>
                    </p>

                </div>
            </div>
        </div>

    </div>
</main>

<script src="register.js"></script>
</body>
</html>
