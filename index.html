<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wallet - Login</title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">


    <!--Nav section-->
    
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html">Smart Wallet</a>
            <span class="text-white d-none d-md-inline">Steering Family Finances as One</span>
        </div>
    </nav>

    <main class="container min-vh-100 d-flex align-items-center py-5">
        <div class="row align-items-center justify-content-center g-5 w-100">

            <div class="col-lg-6 text-center">
                <img src="https://static.vecteezy.com/system/resources/previews/066/863/516/non_2x/money-management-concept-wallet-with-money-accounting-and-saving-money-money-management-business-personal-finance-management-and-savings-flat-style-illustration-vector.jpg"
                    alt="Smart Wallet money management illustration" class="img-fluid rounded-4 mb-4">

                <h2 class="fw-bold text-primary">Manage Your Money Smarter</h2>
                <p class="text-secondary fs-5">
                    Track your income, manage expenses, and plan your family's financial future.
                </p>
            </div>

            <div class="col-lg-5 col-md-8">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <h2 class="fw-bold text-primary mb-2">Welcome Back!</h2>
                        <p class="text-secondary mb-4">Login to your Smart Wallet account.</p>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Username</label>
                                <input type="text" id="username" class="form-control form-control-lg"
                                    placeholder="Enter username" autocomplete="username" required>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" id="password" class="form-control form-control-lg"
                                    placeholder="Enter password" autocomplete="current-password" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                Login
                            </button>
                        </form>

                        <hr class="my-4">

                        <p class="text-center text-secondary mb-0">
                            Don't have an account?
                            <a href="register.html" class="fw-bold text-decoration-none">Register</a>
                        </p>

                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="login.js"></script>
</body>

</html>
